apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: spliteco-ui-tests
  description: The shared Spliteco money screens' tests (packages/spliteco-ui) — the balance card, the why list, add a bill and Settle up, their logic and how each app's theme draws them
spec:
  type: turbo-package
  lifecycle: production
  owner: platform
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture, title: Architecture }
      - { path: docs/runbook.md, role: runbook, title: Runbook }
  domain: starter-tests
  path: tests/spliteco-ui
  subscribe:
    environments:
      - name: dev
        profile: quick-check
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"
    buildCommand: pnpm exec turbo run build --filter=./
    typecheckCommand: pnpm exec turbo run typecheck --filter=./
    preBuildCommand: pnpm exec turbo run test --filter=./
  labels:
    team: platform
    layer: test
