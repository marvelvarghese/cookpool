apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: CP-6
  title: "The money engine: splits, units and the ledger maths, as pure functions"
spec:
  goal: The kitchen worker has a pure, fully tested engine for money (largest-remainder splits, cost of a use), units (exact integer quantities) and the ledger (transaction builders, balances, pairwise lines, the fewest-payments plan with its working, the per-person view).
  affects:
    - default/cookpool/kitchen-worker
    - default/cookpool/kitchen-worker-tests
    - specs/epics/cookpool-kitchen/**
    - tasks/CP-6.TaskContract.yaml
  doneWhen:
    - apps/kitchen-worker/src/engine/{money,units,ledger}.ts exist with no I/O
    - "property tests: parts sum to totals and a used-up item costs exactly its price"
    - "property tests: the settle plan zeroes every balance in at most n − 1 payments"
    - "property tests: reversals restore balances and pairwise lines add up to balances"
    - the design's worked example (paneer dish) reproduces to the paisa
  gates: []
