apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: PW-10
  title: "Push tests that pass every time"
spec:
  goal: The notifications-worker push tests pass every run, alone and together, and any real bug behind their failures (a preferences 500, a payload that will not decrypt) is fixed in the worker.
  affects:
    - default/cookpool/notifications-worker
    - default/cookpool/notifications-worker-tests
    - default/cookpool/db
    - default/cookpool/db-tests
    - default/cookpool/contracts
    - specs/epics/cookpool-app/**
    - tasks/PW-10.TaskContract.yaml
  doneWhen:
    - tests/notifications-worker passes ten runs in a row, in parallel and in band, and each push test file passes alone
    - the root cause is named, and a production bug behind it, if any, is fixed and covered by a test
  gates: []
