apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: AI-5
  title: "Transcription and step questions in the server"
spec:
  goal: "A Workers AI binding for Whisper transcription of short clips counted against voice minutes, and step-aware answers from Haiku with the recipe cached."
  affects:
    - default/cookpool/db
    - default/cookpool/db-tests
    - default/cookpool/db-migrate
    - default/cookpool/contracts
    - default/cookpool/contracts-tests
    - default/cookpool/sdk
    - default/cookpool/kitchen-worker
    - default/cookpool/kitchen-worker-tests
    - default/cookpool/api-edge
    - default/cookpool/api-edge-tests
    - default/cookpool/config-worker-tests
    - specs/epics/cookpool-ai/**
    - tasks/AI-5.TaskContract.yaml
  doneWhen:
    - "kitchen-worker has an AI binding and POST /me/ai/transcribe returns text for a clip of at most 15 seconds, counting audio seconds"
    - "POST /me/ai/ask-step answers in at most 60 words from the scaled recipe, current and next step, heat, time, checkpoint and tip"
    - "audio is never stored; without the binding the routes answer ai_unavailable; tests stub both"
  gates: []
