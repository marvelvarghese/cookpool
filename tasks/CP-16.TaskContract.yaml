apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: CP-16
  title: "Splitting dishes: claims, shares, finalize, leftovers and corrections"
spec:
  goal: A group dish is split by portions or exact amounts — members claim their own share or the cook assigns — and finalizing posts one dish transaction where eaters owe the cook, unclaimed portions become the cook's leftovers, and a correction reverses and reposts without rewriting history.
  affects:
    - default/cookpool/kitchen-worker
    - default/cookpool/kitchen-worker-tests
    - default/cookpool/db
    - default/cookpool/db-tests
    - default/cookpool/db-migrate
    - default/cookpool/contracts
    - default/cookpool/contracts-tests
    - default/cookpool/sdk
    - specs/epics/cookpool-kitchen/**
    - tasks/CP-16.TaskContract.yaml
  doneWhen:
    - members claim half portions on an open group dish, and claims never exceed the portions
    - the cook can assign shares by portions or exact amounts
    - finalize posts one dish transaction in one batch, eaters owe the cook, and unclaimed portions become a leftovers item in the cook's pantry
    - a correction posts a reversal and a new dish transaction in one batch and adjusts the leftovers
    - the worked example nets exactly as design.md says, in each group
  gates: []
