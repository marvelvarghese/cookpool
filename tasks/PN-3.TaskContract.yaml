apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: PN-3
  title: "Restock and purchases in the server"
spec:
  goal: "GET /v1/kitchen/me/restock returns finished-this-week, running-low and usually-bought lines with the last purchase, and POST/DELETE /v1/kitchen/me/purchases adds many items across pantries in one write paid by the caller, with migration 400."
  affects:
    - default/cookpool/db
    - default/cookpool/db-tests
    - default/cookpool/db-migrate
    - default/cookpool/contracts
    - default/cookpool/contracts-tests
    - default/cookpool/sdk
    - default/cookpool/kitchen-worker
    - default/cookpool/kitchen-worker-tests
    - default/cookpool/api-edge
    - default/cookpool/api-edge-tests
    - specs/epics/cookpool-pantry/**
    - tasks/PN-3.TaskContract.yaml
  doneWhen:
    - "migration 400 adds kitchen_items.purchase_id with an index, registered with its checksum"
    - "restock lists items finished in the last 7 days without a newer active one, running-low items, and names bought 3+ times in 120 days whose median gap has passed, each once, with its last purchase"
    - "POST purchases creates 1 to 30 items in one db.batch under one pur_ id, refuses the whole write when any pantry is out of reach, and copies the waste policy from fromItemId"
    - "DELETE purchases removes the unused items and reports the kept ones"
    - "the SDK has restock, buy and undoPurchase; tests cover each group, the batch and the undo"
  gates: []
