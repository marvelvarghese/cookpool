apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: AI-10
  title: "Voice, Check it and Something wrong in guided mode"
spec:
  goal: "In the new frame, guided mode listens briefly and matches commands locally, asks the step question otherwise, and offers Check it with a photo and Something wrong chips, with answers read aloud."
  affects:
    - default/cookpool/web-console-next
    - default/cookpool/web-console-next-tests
    - default/cookpool/sdk
    - specs/epics/cookpool-ai/**
    - tasks/AI-10.TaskContract.yaml
  doneWhen:
    - "after a step is read, a short listening window records only speech; next, back, repeat, timer and how much are matched locally"
    - "other speech goes to ask-step and the answer shows and is read aloud"
    - "every step has Check it, which takes a photo, resizes it and shows the verdict card read aloud"
    - "every step has Something wrong with the problem chips and free text, showing the fix card read aloud"
    - "voice has its own switch and the mic shows only while listening; with newFrame false nothing changes"
  gates: []
