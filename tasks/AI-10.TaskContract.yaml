apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: AI-10
  title: "Voice and whistles in guided mode"
spec:
  goal: "In the new frame, guided mode listens briefly after reading a step and while the mic is held, matches commands locally, asks the step question otherwise, and counts cooker whistles by ear."
  affects:
    - default/cookpool/web-console-next
    - default/cookpool/web-console-next-tests
    - default/cookpool/sdk
    - specs/epics/cookpool-ai/**
    - tasks/AI-10.TaskContract.yaml
  doneWhen:
    - "after a step is read, a short listening window records only speech; next, back, repeat, timer and how much are matched locally"
    - "other speech goes to ask-step and the answer shows and is read aloud"
    - "on whistle steps the whistle counter ticks by sound with plus and minus corrections, with no upload"
    - "voice and whistles each have a switch, the mic shows only while listening; with newFrame false nothing changes"
  gates: []
