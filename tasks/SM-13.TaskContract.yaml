apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: SM-13
  title: "Your measures, in the server"
spec:
  goal: An item can be counted in up to three measures of its own (1 onion is about 150 g, 20 slices in a pack), kept per name in each pantry; a use or an ingredient given in a measure takes its exact amount and keeps its words.
  affects:
    - default/cookpool/kitchen-worker
    - default/cookpool/kitchen-worker-tests
    - default/cookpool/db
    - default/cookpool/db-tests
    - default/cookpool/db-migrate
    - default/cookpool/contracts
    - default/cookpool/contracts-tests
    - default/cookpool/sdk
    - specs/epics/cookpool-simpler/**
    - tasks/SM-13.TaskContract.yaml
  doneWhen:
    - measures are set per item name, pantry and dimension, at most three, by anyone who can use the item
    - item reads carry their measures
    - a use given as 2 onions takes 2 x the measure's amount and the activity reads 2 onions
    - a dish ingredient given in a measure keeps its words
  gates: []
