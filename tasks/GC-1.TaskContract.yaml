    - tasks/GC-4.TaskContract.yaml
    - tasks/GC-5.TaskContract.yaml
    - tasks/GC-6.TaskContract.yaml
    - tasks/GC-7.TaskContract.yaml
  doneWhen:
    - "the README, design, plan, risks and status are merged"
    - "GC-2 to GC-7 each have a contract in tasks/"
  gates: []
