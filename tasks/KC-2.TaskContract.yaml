apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: KC-2
  title: "The Measure drawer on Kitchen"
spec:
  goal: "A Kitchen tick row's measure opens the Measure drawer, where a new measure is saved and picked."
  affects:
    - default/cookpool/web-console-next
    - default/cookpool/web-console-next-tests
    - apps/web-console-next/**
    - tests/web-console-next/**
    - specs/epics/cookpool-kitchen-calm/**
    - tasks/KC-2.TaskContract.yaml
  doneWhen:
    - "Tapping a Kitchen row's measure on stage opens the Measure drawer with units, Your measures and New measure"
    - "A new measure saved there is picked on the row and kept on the item"
    - "The web-console-next tests pass"
  gates: []
