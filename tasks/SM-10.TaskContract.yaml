apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: SM-10
  title: "Simpler screens"
spec:
  goal: Home, + Add, Dish and Pantry are rebuilt as the canvas's Simpler row draws them, under the seven rules, so each reads at a glance on a phone.
  affects:
    - default/cookpool/web-console-next
    - default/cookpool/web-console-next-tests
    - specs/epics/cookpool-simpler/**
    - tasks/SM-10.TaskContract.yaml
  doneWhen:
    - Home fits one phone screen with three to-dos
    - no screen in SM-10 has a sentence of explanation above its main button
    - each screen has one main button in thumb reach and nothing sticky covers what you are choosing
  gates: []
