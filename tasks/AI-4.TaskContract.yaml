apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: AI-4
  title: "Recipe import in the server"
spec:
  goal: "Turn a link, pasted text or a photo into a guided recipe draft with checks; links fetched safely, JSON-LD first, and cached by URL for everyone."
  affects:
    - default/cookpool/db
    - default/cookpool/db-tests
    - default/cookpool/db-migrate
    - default/cookpool/contracts
    - default/cookpool/contracts-tests
    - default/cookpool/sdk
    - default/cookpool/kitchen-worker
    - default/cookpool/kitchen-worker-tests
    - default/cookpool/api-edge
    - default/cookpool/api-edge-tests
    - default/cookpool/config-worker-tests
    - specs/epics/cookpool-ai/**
    - tasks/AI-4.TaskContract.yaml
  doneWhen:
    - "POST /me/ai/recipe-import accepts a url, text or image and returns a draft in the recipe form shape with guided step fields and checks"
    - "links are fetched over http(s) only, private addresses refused, size, time and redirects capped, JSON-LD preferred"
    - "a URL's draft is cached for 30 days and reused for everyone at no model cost; tests stub the fetch and the API"
  gates: []
