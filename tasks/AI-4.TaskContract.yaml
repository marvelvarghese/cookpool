apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: AI-4
  title: "Recipe from a photo in the server"
spec:
  goal: "Turn a photo of a cookbook page, handwritten card or screenshot into a guided recipe draft with checks; Haiku first, Sonnet on a failed check; the image is never stored."
  affects:
    - default/cookpool/db
    - default/cookpool/db-tests
    - default/cookpool/db-migrate
    - default/cookpool/contracts
    - default/cookpool/contracts-tests
    - default/cookpool/sdk
    - default/cookpool/kitchen-worker
    - default/cookpool/kitchen-worker-tests
    - default/cookpool/api-edge
    - default/cookpool/api-edge-tests
    - default/cookpool/config-worker-tests
    - specs/epics/cookpool-ai/**
    - tasks/AI-4.TaskContract.yaml
    - tasks/AI-9.TaskContract.yaml
    - tasks/AI-10.TaskContract.yaml
    - tasks/AI-5.TaskContract.yaml
  doneWhen:
    - "POST /me/ai/recipe-photo reads a photo of at most 1.5 MB into a draft in the recipe form shape with guided step fields and checks"
    - "the draft is validated and retried once on Sonnet when it fails; the image is never stored or logged"
    - "the epic docs say import is photo only; tests stub the API"
  gates: []
