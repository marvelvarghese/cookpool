apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: KC-9
  title: "Appearance in You's settings"
spec:
  goal: "You has an Appearance setting, System, Light or Dark on this device, which the new look's dark follows."
  affects:
    - default/cookpool/web-console-next
    - default/cookpool/web-console-next-tests
    - apps/web-console-next/**
    - tests/web-console-next/**
    - specs/epics/cookpool-kitchen-calm/**
    - tasks/KC-9.TaskContract.yaml
  doneWhen:
    - "Stage's You shows Appearance with System, Light and Dark"
    - "Dark turns the app black on a phone set to light, and Light keeps it light on a dark phone, after a reload too"
    - "The web-console-next tests pass"
  gates: []
