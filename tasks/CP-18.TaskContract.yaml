apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: CP-18
  title: "Use it before it goes: the daily sweep and Cookpool's emails"
spec:
  goal: A daily cron sweep emails each person one digest of the items they can use that are about to pass their use-by date, and the app emails people when a dish is posted for claims or when someone logs a use or expense for them — once each, respecting their notification preferences.
  affects:
    - default/cookpool/kitchen-worker
    - default/cookpool/kitchen-worker-tests
    - default/cookpool/notifications-worker
    - default/cookpool/notifications-worker-tests
    - default/cookpool/identity-worker
    - default/cookpool/identity-worker-tests
    - default/cookpool/config-worker-tests
    - default/cookpool/db
    - default/cookpool/db-tests
    - default/cookpool/db-migrate
    - default/cookpool/contracts
    - default/cookpool/contracts-tests
    - pnpm-lock.yaml
    - specs/epics/cookpool-kitchen/**
    - tasks/CP-18.TaskContract.yaml
  doneWhen:
    - kitchen-worker has a scheduled() handler and its rendered stage and prod configs carry a daily cron trigger, asserted by a test
    - the sweep enqueues at most one use-soon digest per person per day, idempotent on re-run, and /health reports the last sweep
    - posting a dish for claims emails the group's other members, and a use or expense logged for someone else emails them, once per transaction
    - the three templates render subject, text and HTML in the Cookpool voice with links into the app
  gates: []
