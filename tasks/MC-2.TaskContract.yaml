apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: MC-2
  title: "Delegated tokens and scope enforcement"
spec:
  goal: "identity-worker mints, lists, refreshes and revokes delegated user tokens with scopes (migration 490), resolve maps them to the user with their scopes, and api-edge enforces a scope allowlist for them."
  affects:
    - default/cookpool/db
    - default/cookpool/db-tests
    - default/cookpool/db-migrate
    - default/cookpool/contracts
    - default/cookpool/contracts-tests
    - default/cookpool/sdk
    - default/cookpool/identity-worker
    - default/cookpool/identity-worker-tests
    - default/cookpool/api-edge
    - default/cookpool/api-edge-tests
    - default/cookpool/config-worker-tests
    - specs/epics/cookpool-mcp/**
    - tasks/MC-2.TaskContract.yaml
  doneWhen:
    - "migration 490 adds identity_delegations; sps_dlg_ tokens are stored hashed, last 90 days, and resolve as the user with delegation id, scopes and client name"
    - "a signed-in session can create, list and revoke delegations; a delegated token can call none of those routes"
    - "api-edge allows a delegated actor only the allowlisted method and path per scope and refuses everything else with reason scope"
    - "a test enumerates every write route and shows a delegated token is refused unless allowlisted; revoked tokens stop working"
  gates: []
