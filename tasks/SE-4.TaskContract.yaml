apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: SE-4
  title: "Cookpool's money runs on Spliteco"
spec:
  goal: "Cookpool's Money tab keeps kitchen bills, balances and settle up but runs on spliteco-worker and shared screens, with Kitchen and Other balances and a one-tap way into Spliteco."
  affects:
    - default/cookpool/kitchen-worker
    - default/cookpool/kitchen-worker-tests
    - default/cookpool/web-console-next
    - default/cookpool/web-console-next-tests
    - default/cookpool/spliteco-worker
    - default/cookpool/spliteco-web
    - default/cookpool/spliteco-ui
    - default/cookpool/notifications-worker
    - default/cookpool/notifications-worker-tests
    - default/cookpool/spliteco-ui-tests
    - default/cookpool/spliteco-worker-tests
    - default/cookpool/spliteco-web-tests
    - default/cookpool/db-migrate
    - default/cookpool/api-edge
    - default/cookpool/api-edge-tests
    - default/cookpool/kitchen-engine
    - default/cookpool/policy-engine
    - default/cookpool/policy-engine-tests
    - default/cookpool/contracts-tests
    - default/cookpool/identity-worker
    - default/cookpool/identity-worker-tests
    - default/cookpool/membership-worker
    - default/cookpool/membership-worker-tests
    - default/cookpool/db
    - default/cookpool/db-tests
    - default/cookpool/contracts
    - default/cookpool/sdk
    - apps/spliteco-worker/**
    - apps/spliteco-web/**
    - packages/spliteco-ui/**
    - tests/spliteco-web/**
    - tests/spliteco-ui/**
    - tests/kitchen-worker/**
    - tests/web-console-next/**
    - tests/identity-worker/**
    - tests/spliteco-worker/**
    - specs/epics/cookpool-spliteco/**
    - tasks/SE-4.TaskContract.yaml
  doneWhen:
    - "Cookpool's Money tab adds bills and settles up through spliteco-worker, and a payment made in either app shows in both"
    - "Cookpool shows only the Kitchen balance; Spliteco shows Kitchen and Other, and a Spliteco payment settles Kitchen first"
    - "A new Cookpool kitchen appears in Spliteco by itself; groups made in Spliteco never appear in Cookpool"
    - "More in Spliteco opens that group in Spliteco already signed in, and Back returns to Cookpool"
    - "Leaving a kitchen while either balance is open is still refused"
  gates: []
