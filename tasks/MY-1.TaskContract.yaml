apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: MY-1
  title: "Money, native: the spec"
spec:
  goal: "This epic's doc set, its epic.yaml and its task contracts are on main, and the old money-inside round two (MN-8) is marked superseded."
  affects:
    - specs/epics/money-native/**
    - specs/epics/money-inside/**
