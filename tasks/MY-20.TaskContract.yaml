  affects:
    - default/cookpool/web-console-next
    - default/cookpool/web-console-next-tests
    - apps/web-console-next/**
    - tests/web-console-next/**
    - specs/epics/money-native/**
    - tasks/MY-20.TaskContract.yaml
  doneWhen:
    - "Each screen is audited against its board at 390x844, light and dark, and the diff table is in the PR body"
    - "Every measured difference is fixed: sheet, fields, radio rows, search, group rows, toggles, buttons, tab bar, page background, Powered by Spliteco"
    - "Tests pin the key measurements and flows; web-console-next tests, typecheck and lint pass"
  gates: []
