apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: PN-10
  title: "Close the pantry epic"
spec:
  goal: "Record what PN-2 to PN-9 shipped, fill in Shipped as and After this epic, and mark the epic completed once every task is done."
  affects:
    - specs/epics/cookpool-pantry/**
    - tasks/PN-10.TaskContract.yaml
    # Widened in PN-10's own PR: PN-8's contract had a doneWhen line over the
    # 200-character limit, so it was never attached; the fix splits that line.
    - tasks/PN-8.TaskContract.yaml
  doneWhen:
    - "the README status reads shipped on stage with Shipped as filled in"
    - "IMPLEMENTATION-STATUS has every milestone and PR"
    - "After this epic lists what was left"
  gates: []
