apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: SI-10
  title: "Cookpool on the new Cloudflare account"
spec:
  goal: Cookpool's stage and prod run on the owner's new Cloudflare account (Marvelvarghese18), at cookpool.workers.dev, with a fresh database and KV namespace there, deployed by tokens minted from the new connection.
  affects:
    - default/cookpool/admin-worker
    - default/cookpool/api-edge
    - default/cookpool/billing-worker
    - default/cookpool/config-worker
    - default/cookpool/events-worker
    - default/cookpool/identity-worker
    - default/cookpool/integrations-worker
    - default/cookpool/kitchen-worker
    - default/cookpool/membership-worker
    - default/cookpool/metering-worker
    - default/cookpool/notifications-worker
    - default/cookpool/policy-worker
    - default/cookpool/projects-worker
    - default/cookpool/web-console-next
    - default/cookpool/webhooks-worker
    - default/cookpool/cloudflare-d1
    - default/cookpool/cloudflare-kv
    - default/cookpool/db-migrate
    - default/cookpool/config-worker-tests
    - default/cookpool/web-console-next-tests
    - intent.yaml
    - .rebrand/values.json
    - ai/context/**
    - specs/epics/cookpool-sign-in/**
    - specs/epics/cookpool-kitchen/**
    - tasks/SI-10.TaskContract.yaml
  doneWhen:
    - every worker and the app answer on the new account at *.cookpool.workers.dev, for stage and prod
    - the D1 database and KV namespace exist in the new account with every migration applied
    - deploys use tokens minted from the new connection, and the old account is left untouched
  gates: []
