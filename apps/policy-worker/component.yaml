apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: policy-worker
  description: Cloudflare Worker for policy authorization decisions
spec:
  type: cloudflare-worker-turbo
  lifecycle: production
  owner: platform
  # Its pages, attached to it in the workspace's catalog: what the Docs
  # library shows for it, and what the catalog's docs and runbook checks read.
  # Generated from what this manifest declares
  # (tooling/catalog/gen-component-docs.mjs).
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture, title: Architecture }
      - { path: docs/runbook.md, role: runbook, title: Runbook }
  domain: starter-runtime
  path: apps/policy-worker
  # What this worker bundles from outside its own folder (SE-10). `orun plan`
  # picks a component by its own path, so without these a change to the
  # rules alone never redeployed policy-worker: SE1 put the spliteco.* grants
  # in policy-engine and stage and prod kept denying them until SE-9. The
  # engine is all runtime; from contracts only policy.ts is (POLICY_VERSION),
  # the rest is types, so the rest of contracts is left out.
  change:
    inputs:
      - packages/policy-engine/**
      - packages/contracts/src/policy.ts
  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"
    workspaceDir: ../..
    appDir: .
    # BF6: identity/role inputs for the deploy lane's wire-credentials step.
    # Inert until this worker gets a wrangler template (fleet rollout, BF6b).
    orgName: sourceplane
    owner: sourceplane
    repo: cookpool

    turboFilter: "@saas/policy-worker"
    wranglerConfig: wrangler.jsonc
    installCommand: pnpm install --frozen-lockfile
    buildCommand: pnpm exec turbo run build --filter=@saas/policy-worker
    typecheckCommand: pnpm exec turbo run typecheck --filter=@saas/policy-worker
    dryRunCommand: pnpm exec wrangler deploy --dry-run --config wrangler.jsonc --env prod
    deployCommand: pnpm exec wrangler deploy --config wrangler.jsonc --env prod
    # The fleet's binding targets exist before any of it deploys: every worker
    # that holds a service binding waits on this one (an enforced dependsOn on
    # main), and this step uploads a placeholder for each target that does not
    # exist yet, so their first deploys carry their full bindings
    # (tooling/deploy/fleet-stubs.mjs). On a live product it uploads nothing.
    preDeployCommand: "node ../../tooling/deploy/fleet-stubs.mjs --root ../.."
    migrationCommand: "echo 'No migrations configured.'"
    smokeCommand: "echo 'No smoke test configured.'"
  labels:
    team: platform
    layer: runtime
    surface: policy
    runtime: cloudflare
# ci: trigger full-component verification (orun v2.12.0 upgrade — PR #183)
# orun: redeploy SI-10 move to the new Cloudflare account 2026-11-03T15:35:52Z
# orun: redeploy SE-9 so policy-worker bundles the policy-engine that grants spliteco.* (added in SE1, #120) 2026-11-13
