apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: web-console-next
  description: Next.js 15 + opennextjs/cloudflare delivery of the cookpool web console (per-environment, Workers + Static Assets)
spec:
  type: cloudflare-workers-assets-turbo
  lifecycle: production
  owner: platform
  # Its pages, attached to it in the workspace's catalog: what the Docs
  # library shows for it, and what the catalog's docs and runbook checks read.
  # Generated from what this manifest declares
  # (tooling/catalog/gen-component-docs.mjs).
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture, title: Architecture }
      - { path: docs/runbook.md, role: runbook, title: Runbook }
  domain: starter-ui
  path: apps/web-console-next
  # Its own lane per environment (execution.lanes in intent.yaml): the Next.js
  # build is the longest job in the plan, and a shared lane would wait on it.
  lane: isolated
  # THE API ON THE APP'S ADDRESS (Cookpool SM-4): the console Worker answers
  # `/api/*` by calling api-edge over a service binding (wrangler.jsonc
  # `env.<env>.services`, API_EDGE → cookpool-api-edge-<env>). A binding is a
  # deploy-time prerequisite (Cloudflare refuses a deploy whose bound Worker
  # does not exist, code 10143), and the console forwards the client's address
  # in a header only the api-edge of this change believes, so on main the
  # console deploys after api-edge again. (It deployed beside it since
  # stack-tectonic 0.18.2, when the only reason to wait was the smoke's
  # health check, now under retry; saas-console-artifact CA5.) api-edge
  # depends on nothing here, so there is no cycle; on a fresh account its own
  # wait on policy-worker places the placeholders (tooling/deploy/fleet-stubs.mjs).
  dependsOn:
    - component: api-edge
      mode: enforced
      modeRules:
        - mode: advisory
          when:
            triggerRef: github-pull-request
  # wrangler picks the environment's section of wrangler.jsonc (its API_EDGE
  # binding) from CLOUDFLARE_ENV: the composition deploys with `--name`, not
  # `--env`. `{{ .environment }}` is the Orun environment of the job.
  env:
    CLOUDFLARE_ENV: "{{ .environment }}"
  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        # A pull request deploys nothing, so nothing on one waits; a merge
        # keeps the ordering (migrations, infrastructure, the edge).
        dependencyRules:
          - mode: advisory
            when:
              triggerRef: github-pull-request
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        # A pull request deploys nothing, so nothing on one waits; a merge
        # keeps the ordering (migrations, infrastructure, the edge).
        dependencyRules:
          - mode: advisory
            when:
              triggerRef: github-pull-request
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"

    workspaceDir: ../..
    appDir: .

    turboFilter: "@saas/web-console-next"
    wranglerConfig: wrangler.jsonc

    # @opennextjs/cloudflare emits a Worker entrypoint plus a static-assets
    # directory bound via ASSETS — both are deployed in one `wrangler deploy`.
    # (The build's output, checked after it. Since SM-4 the deployed `main` is
    # src/worker/index.mjs, which answers `/api/*` and imports this lazily.)
    workerEntrypoint: .open-next/worker.js
    assetsDir: .open-next/assets

    # Worker is named per-env (cookpool-web-console-next-{dev,stage,prod}),
    # matching the prior Pages-project naming convention so the cutover in
    # Task 0083 only needs to repoint the custom domain.
    workerName: cookpool-web-console-next
    environmentAwareWorkerName: true

    # The account's workers.dev subdomain; exposed to the smoke step as
    # ${WORKERS_DEV_SUBDOMAIN} and used to build ${DEPLOYED_URL}.
    workersDevSubdomain: cookpool

    # No environmentBuildVar (saas-console-artifact CA2): the console learns its
    # environment at runtime — CONSOLE_DEPLOY_ENV if set, else the `-<env>` its
    # workers.dev host carries — so the build is the same for every environment
    # and a build made anywhere can be deployed to any of them.

    installCommand: pnpm install --frozen-lockfile
    # saas-console-artifact CA4: with a console-artifact.pin.json (written by
    # the bootstrap's 05 phase) and sources that still hash to it, this fetches
    # the baseline's prebuilt console and verifies its sha256 instead of
    # building; otherwise it runs `turbo run build --filter=@saas/web-console-next`.
    buildCommand: node scripts/console-artifact.mjs build

    # Smoke: follow redirects (root `redirect("/orgs")` is a 307) and confirm
    # the SSR'd page contains the console marker. The api-edge worker is the
    # same hostname pattern as before.
    # Buffer curl into a variable before grepping so `grep -q` matching early
    # cannot SIGPIPE curl and produce a flaky exit-23 race (observed on prod
    # in main CI run 26628207777 even though the site was live).
    # `${WORKERS_DEV_SUBDOMAIN}` is exported by the composition's deploy/smoke
    # step from the `workersDevSubdomain` parameter above (BF3: no duplicated
    # subdomain literal here).
    # Then the API on the console's own address (SM-4): `/api/health` must
    # reach api-edge over the binding, and api-edge must have taken the
    # client's address from the console (`"source":"console"`), which proves
    # the binding's props arrived. A stage that fails it holds prod back.
    smokeCommand: "html=$(curl -sfL \"${DEPLOYED_URL}/\") && echo \"${html}\" | grep -q 'cookpool Console' && health=$(curl -sf \"https://cookpool-api-edge-${ORUN_ENVIRONMENT}.${WORKERS_DEV_SUBDOMAIN}.workers.dev/health\") && echo \"${health}\" | grep -q ok && api=$(curl -sf \"${DEPLOYED_URL}/api/health\") && echo \"${api}\" | grep -q '\"source\":\"console\"'"
  labels:
    team: platform
    layer: delivery
    surface: web-console-next
    runtime: cloudflare
# ci: re-trigger web-console after api-edge is live (20260622T142123Z)
# orun: redeploy SI-10 move to the new Cloudflare account 2026-11-03T15:35:52Z
